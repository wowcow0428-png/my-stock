<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Capital & Pledge Terminal</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="資產質押">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#030712">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(15, 23, 42, 0.65);
      --card-inner: rgba(30, 41, 59, 0.45);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      --cyan: #38bdf8;
      --up-red: #fb7185;
      --down-green: #34d399;
      --gold: #fbbf24;
      --purple: #c084fc;
      --nav-bg: rgba(3, 7, 18, 0.92);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0c1a36 0%, #030712 55%, #01040a 100%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 0;
      padding-bottom: calc(96px + env(safe-area-inset-bottom, 20px));
      letter-spacing: -0.015em;
    }

    .num-font {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .glass-panel::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.35), transparent);
    }

    @keyframes flashUp {
      0% { background-color: rgba(251, 113, 133, 0.35); }
      100% { background-color: transparent; }
    }
    @keyframes flashDown {
      0% { background-color: rgba(52, 211, 153, 0.35); }
      100% { background-color: transparent; }
    }
    .flash-up { animation: flashUp 0.8s ease-out; }
    .flash-down { animation: flashDown 0.8s ease-out; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding-top: calc(env(safe-area-inset-top, 20px) + 10px);
      padding-bottom: 12px;
      padding-left: calc(env(safe-area-inset-left, 0px) + 20px);
      padding-right: calc(env(safe-area-inset-right, 0px) + 20px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-icon-box {
      width: 32px; height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .pulse-dot {
      width: 7px; height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .container { max-width: 960px; margin: 0 auto; padding: 18px; }

    .tab-view { display: none; }
    .tab-view.active-view { display: block; animation: viewIn 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes viewIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-stat-card { padding: 26px; }
    .hero-stat-card::after {
      content: "";
      position: absolute;
      top: -70px; right: -70px;
      width: 190px; height: 190px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2), transparent 70%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hero-val {
      font-size: 2.35rem;
      font-weight: 800;
      margin: 8px 0;
      background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-sub { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }

    .dividend-hero-badge {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(192, 132, 252, 0.08));
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: 20px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dividend-hero-badge:hover {
      border-color: rgba(251, 191, 36, 0.5);
      transform: translateY(-1px);
    }
    .dividend-tag {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.2);
      color: var(--gold);
      font-weight: 700;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    .mini-stat {
      background: var(--card-inner);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 15px;
    }
    .mini-stat-label { font-size: 0.74rem; color: var(--text-muted); font-weight: 500; }
    .mini-stat-val { font-size: 1.15rem; font-weight: 700; margin-top: 5px; color: #fff; }

    .gauge-wrapper { padding: 20px; }
    .gauge-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .gauge-ratio { font-size: 1.95rem; font-weight: 800; }
    .progress-bar-bg {
      height: 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .gauge-markers {
      display: flex;
      justify-content: space-between;
      font-size: 0.73rem;
      color: var(--text-sub);
    }

    .filter-pills { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
    .pill-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .pill-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .stock-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 15px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .stock-card:hover {
      background: rgba(30, 41, 59, 0.55);
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .stock-main-row { display: flex; justify-content: space-between; align-items: center; }
    .stock-symbol-group { display: flex; align-items: center; gap: 8px; }
    .symbol-text { font-size: 1.1rem; font-weight: 800; color: #fff; }
    .stock-name-tag { font-size: 0.84rem; color: #cbd5e1; font-weight: 600; }
    .tag-channel {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stock-price-val { font-size: 1.1rem; font-weight: 800; text-align: right; }
    .stock-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.83rem;
    }
    .detail-item-label { color: var(--text-muted); font-size: 0.74rem; font-weight: 500; }
    .detail-item-val { font-weight: 700; margin-top: 2px; }

    .dividend-timeline-box {
      background: rgba(10, 15, 29, 0.75);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .dividend-row-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
    }
    .dividend-row-item:last-child { border-bottom: none; }

    .batches-drawer {
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(8, 12, 22, 0.85);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: none;
    }
    .batches-drawer.open { display: block; animation: viewIn 0.18s; }
    .batch-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      font-size: 0.8rem;
    }
    .batch-item:last-child { border-bottom: none; }

    .btn {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 11px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.18s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      box-shadow: none;
    }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; border-radius: 8px; }

    .form-group { margin-bottom: 14px; position: relative; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input, .form-select {
      width: 100%;
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border 0.18s;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .suggestions-menu {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: #0f172a;
      border: 1px solid var(--cyan);
      border-radius: 12px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 60;
      margin-top: 4px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      display: none;
    }
    .suggestion-row {
      padding: 11px 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.88rem;
    }
    .suggestion-row:active { background: #1e293b; }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(70px + env(safe-area-inset-bottom, 20px));
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 4px);
      padding-top: 8px;
      background: var(--nav-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      z-index: 50;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.6);
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      gap: 5px;
      height: 48px;
      transition: all 0.18s ease;
    }
    .nav-btn svg { width: 25px; height: 25px; fill: currentColor; }
    .nav-btn.active {
      color: var(--cyan);
      transform: translateY(-2px);
    }

    .color-up { color: var(--up-red); }
    .color-down { color: var(--down-green); }

    .ptr-box {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0; right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      transform: translateY(-100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
      z-index: 45;
      background: linear-gradient(180deg, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0) 100%);
      opacity: 0;
    }
    .ptr-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(56, 189, 248, 0.25);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: ptrSpin 0.75s linear infinite;
    }
    @keyframes ptrSpin { 100% { transform: rotate(360deg); } }
    .ptr-text { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); }

    .widget-reorder-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.5);
      padding: 6px 14px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      border: 1px solid var(--border-subtle);
      border-bottom: none;
    }
    .overview-widget-item { margin-bottom: 14px; }
    .overview-widget-item .glass-panel { border-top-left-radius: 0; border-top-right-radius: 0; }
    .overview-widget-item .dividend-hero-badge { border-top-left-radius: 0; border-top-right-radius: 0; }
    .btn-mini {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 4px;
    }
    .btn-mini:active { background: var(--cyan); color: #030712; }
  
    /* iOS 原生長按拖曳排序與小工具樣式 */
    .widget-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .overview-widget-item {
      position: relative;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, opacity 0.2s;
    }

    /* 長按進入拖曳模式 (Jiggle / Float) */
    .overview-widget-item.is-dragging {
      opacity: 0.92;
      transform: scale(1.03);
      z-index: 999;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 20px var(--cyan-glow);
      border-radius: 20px;
    }

    .overview-widget-item.drag-placeholder {
      opacity: 0.25;
      border: 2px dashed var(--cyan);
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.05);
    }

    /* 頂部輕量拖曳手柄與尺寸切換列 */
    .card-ios-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px 4px;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .card-ios-header .drag-handle-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: grab;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .card-ios-header .drag-handle-indicator:active {
      cursor: grabbing;
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
    }

    .card-size-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .card-size-btn:active {
      background: var(--cyan);
      color: #030712;
      transform: scale(0.95);
    }

    /* 迷你卡片 (Compact) 模式樣式 */
    .overview-widget-item.compact-mode .expandable-content {
      display: none !important;
    }
    .overview-widget-item.compact-mode .glass-panel {
      padding: 16px 20px !important;
    }
    .overview-widget-item.compact-mode .hero-val {
      font-size: 1.65rem !important;
      margin: 4px 0 !important;
    }

  </style>
</head>
<body>
  <div id="ptrContainer" class="ptr-box">
    <div id="ptrSpinner" class="ptr-spinner"></div>
    <span id="ptrText" class="ptr-text">下拉刷新現價...</span>
  </div>

  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#38bdf8"><path d="M4 10h3v7H4zM10.5 4h3v13h-3zM17 14h3v3h-3zM2 20h20v2H2z"/></svg>
      </div>
      <span>CAPITAL PRO</span>
    </div>
    <div class="header-meta">
      <span class="pulse-dot"></span>
      <span id="rateMeta" class="num-font">USD ≈ 32.00</span>
      <span style="font-size:0.75rem; color:var(--cyan);">免Key自動連線</span>
    </div>
  </header>

  <div class="container">
    <!-- 1. 總覽 -->
    <div id="viewOverview" class="tab-view active-view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">📱 戰情室版面：自由縮放與移動</span>
        <button class="btn btn-sm" onclick="switchTab('viewAdd')">＋ 新增記帳</button>
      </div>
      <div id="overviewCardsContainer"></div>
    </div>

    <!-- 2. 持股庫存 -->
    <div id="viewPortfolio" class="tab-view">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <div style="font-size:1.1rem; font-weight:800;">📈 即時持股庫存</div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" onclick="fetchAllQuotes(false)">⚡ 更新現價</button>
          <button class="btn btn-sm btn-secondary" onclick="switchTab('viewAdd')">＋ 記帳</button>
        </div>
      </div>
      <div class="filter-pills">
        <button class="pill-btn active" onclick="setFilter('ALL', this)">全部標的</button>
        <button class="pill-btn" onclick="setFilter('TW', this)">台股</button>
        <button class="pill-btn" onclick="setFilter('US_DIRECT', this)">美股券商</button>
        <button class="pill-btn" onclick="setFilter('US_SUB', this)">複委託</button>
      </div>
      <div id="portfolioCardList"></div>
    </div>

    <!-- 3. 領息專區 -->
    <div id="viewDividends" class="tab-view">
      <div class="glass-panel" style="padding:20px; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div style="font-size:1.1rem; font-weight:800;">🎁 2026 除權息與配息總覽</div>
          <button class="btn btn-sm" onclick="autoFetchDividendSchedules(false)">⚡ 刷新時程</button>
        </div>
        <div class="stats-row" style="margin-bottom:14px;">
          <div class="mini-stat"><div class="mini-stat-label">2026 累計已領息收</div><div class="mini-stat-val num-font" style="color:var(--gold);" id="divCardTotalReceived">NT$ 0</div></div>

    render();

  function setupCardTouchDnd(cardEl) {
    let pressTimer = null;
    let isDragging = false;
    let startTouchY = 0;

    const handleTouchStart = (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
      const touch = e.touches[0];
      startTouchY = touch.clientY;
      pressTimer = setTimeout(() => {
        isDragging = true;
        if (navigator.vibrate) navigator.vibrate(30);
        cardEl.classList.add('is-dragging');
      }, 350);
    };

    const handleTouchMove = (e) => {
      const touch = e.touches[0];
      const diffY = touch.clientY - startTouchY;
      if (!isDragging && Math.abs(diffY) > 10) {
        clearTimeout(pressTimer);
        return;
      }
      if (isDragging) {
        e.preventDefault();
        cardEl.style.transform = `translateY(${diffY}px) scale(1.03)`;
        const currentCenterY = touch.clientY;
        const container = document.getElementById('overviewCardsContainer');
        const siblings = [...container.querySelectorAll('.overview-widget-item:not(.is-dragging)')];
        const targetSibling = siblings.find(sib => {
          const rect = sib.getBoundingClientRect();
          return currentCenterY >= rect.top && currentCenterY <= rect.bottom;
        });
        if (targetSibling) {
          const rect = targetSibling.getBoundingClientRect();
          const next = (currentCenterY - rect.top) / (rect.bottom - rect.top) > 0.5;
          container.insertBefore(cardEl, next ? targetSibling.nextSibling : targetSibling);
        }
      }
    };

    const handleTouchEnd = () => {
      clearTimeout(pressTimer);
      if (isDragging) {
        isDragging = false;
        cardEl.classList.remove('is-dragging');
        cardEl.style.transform = '';
        const container = document.getElementById('overviewCardsContainer');
        widgetOrder = [...container.querySelectorAll('.overview-widget-item')].map(item => item.getAttribute('data-id'));
        localStorage.setItem('capital_pro_widget_order_v2', JSON.stringify(widgetOrder));
        if (navigator.vibrate) navigator.vibrate(15);
      }
    };

    cardEl.addEventListener('touchstart', handleTouchStart, { passive: false });
    cardEl.addEventListener('touchmove', handleTouchMove, { passive: false });
    cardEl.addEventListener('touchend', handleTouchEnd);
    cardEl.addEventListener('touchcancel', handleTouchEnd);
  }

  // 4. 通用字典與計算
  const TW_ETFS = new Set(['0050', '006208', '00631L', '0056', '00878', '00919', '00929', '00679B', '00687B']);
  const BUILTIN_STOCK_NAMES = {
    '0050': '元大台灣50', '006208': '富邦台50', '00631L': '元大台灣50正2', '2330': '台積電', '2317': '鴻海',
    '2454': '聯發科', '2308': '台達電', '2324': '仁寶', 'VOO': 'Vanguard S&P 500', 'QQQ': 'Invesco QQQ',
    'NVDA': 'NVIDIA', 'TSLA': 'Tesla', 'GOOGL': 'Alphabet', 'AAPL': 'Apple'
  };

  function getStockDisplayName(sym) {
    if (!sym) return '';
    return BUILTIN_STOCK_NAMES[sym.toUpperCase()] || '';
  }

  function calculateCathayLiquidation(channel, symbol, shares, price) {
    const grossVal = Math.round(shares * price);
    if (channel !== 'TW') return { grossVal, netVal: grossVal, tax: 0, fee: 0 };
    const sym = symbol.toUpperCase();
    const isETF = sym.startsWith('00') || TW_ETFS.has(sym);
    const tax = Math.floor(grossVal * (isETF ? 0.001 : 0.003));
    const fee = Math.max(1, Math.floor(grossVal * 0.001425 * (feeDiscount / 10)));
    return { grossVal, netVal: grossVal - tax - fee, tax, fee };
  }

    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function fetchUSQuoteExtended(sym) {
    let price = null;
    try {
      const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=5m&range=1d`)}`);

  async function fetchAllQuotes(silent = true) {
    const holdings = calculateHoldings();
    const allSymbols = new Set([...Object.values(holdings).map(h => h.symbol), ...pledges.map(p => p.symbol)]);
    if (allSymbols.size === 0) return;
    for (const sym of allSymbols) {
      try {
        if (/^\d+/.test(sym)) {
          const res = await fetch(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=${sym}&start_date=2026-01-01`);
          const data = await res.json();
          if (data?.data?.length > 0) currentQuotes[sym] = parseFloat(data.data[data.data.length - 1].close);
        } else {
          const p = await fetchUSQuoteExtended(sym);
          if (p) currentQuotes[sym] = p;
        }
      } catch(e) {}
    }
    localStorage.setItem('open_portfolio_quotes_v3', JSON.stringify(currentQuotes));
    render();
  }

  function calculateHoldings() {
    const holdings = {};
    const sorted = [...trades].sort((a, b) => new Date(a.date) - new Date(b.date));
    sorted.forEach(t => {
      const sym = t.symbol.toUpperCase();
      const key = `${t.channel}_${sym}`;
      if (!holdings[key]) holdings[key] = { channel: t.channel, symbol: sym, shares: 0, totalCost: 0, batches: [] };
      const h = holdings[key];
      const count = parseFloat(t.shares); const pr = parseFloat(t.price);
      if (t.type === 'BUY') { h.shares += count; h.totalCost += (count * pr); h.batches.push({ date: t.date, shares: count, price: pr, type: 'BUY' }); }
      else if (t.type === 'SELL' && h.shares > 0) {
        const avg = h.totalCost / h.shares; h.shares = Math.max(0, h.shares - count); h.totalCost = h.shares * avg; h.batches.push({ date: t.date, shares: count, price: pr, type: 'SELL' });
      }
    });
    return holdings;
  }

  function calculatePledgeInterest(p) {
    const days = Math.max(0, Math.floor((new Date() - new Date(p.lastAdjustDate || p.date)) / 86400000));
    const daily = (parseFloat(p.loan) * (parseFloat(p.currentRate) / 100)) / 365;
    return { daily: Math.round(daily), total: Math.round(parseFloat(p.baseInterest || 0) + daily * days) };
  }

  function renderPortfolioList() {
    const listEl = document.getElementById('portfolioCardList');
    if (!listEl) return;
    listEl.innerHTML = '';
    const holdings = calculateHoldings();
    for (const [key, item] of Object.entries(holdings)) {
      if (item.shares <= 0.00001) continue;
      if (currentFilter !== 'ALL' && item.channel !== currentFilter) continue;
      const avg = item.shares > 0 ? (item.totalCost / item.shares) : 0;
      if (!currentQuotes[item.symbol]) currentQuotes[item.symbol] = avg;
      const quote = currentQuotes[item.symbol];
      const { netVal } = calculateCathayLiquidation(item.channel, item.symbol, item.shares, quote);
      const profit = netVal - item.totalCost;
      const roi = item.totalCost > 0 ? (profit / item.totalCost * 100) : 0;
      const curr = item.channel === 'TW' ? 'NT$' : '$';
      const chName = item.channel === 'US_DIRECT' ? '美股券商' : (item.channel === 'US_SUB' ? '複委託' : '台股現股');

      listEl.innerHTML += `
        <div class="stock-card" onclick="toggleCardDrawer('${key}')">
          <div class="stock-main-row">
            <div class="stock-symbol-group"><span class="symbol-text">${item.symbol}</span><span class="stock-name-tag">${getStockDisplayName(item.symbol)}</span><span class="tag-channel">${chName}</span></div>
            <div><div class="stock-price-val num-font">${curr} ${quote.toFixed(2)}</div><div class="num-font" style="font-size:0.76rem; text-align:right; color:${profit>=0?'var(--up-red)':'var(--down-green)'};">${profit>=0?'+':''}${roi.toFixed(2)}%</div></div>
          </div>
          <div class="stock-detail-grid num-font">
            <div><div class="detail-item-label">數量 / 均價</div><div class="detail-item-val">${item.shares.toLocaleString()} 股 (${avg.toFixed(2)})</div></div>
            <div style="text-align:right;"><div class="detail-item-label">現值 / 損益</div><div class="detail-item-val ${profit>=0?'color-up':'color-down'}">${curr} ${Math.round(netVal).toLocaleString()} (${profit>=0?'+':''}${Math.round(profit).toLocaleString()})</div></div>
          </div>
        </div>
      `;
    }
  }

  function renderPledges() {
    const listEl = document.getElementById('pledgeCardList');
    if (!listEl) return { sumLoan: 0, sumInterest: 0 };
    listEl.innerHTML = '';
    let sumLoan = 0, sumCollateral = 0, sumInterest = 0;

    pledges.forEach((p, idx) => {
      const quote = currentQuotes[p.symbol] || 0;
      const colVal = p.shares * quote;
      const loan = parseFloat(p.loan);
      const { total } = calculatePledgeInterest(p);
      sumLoan += loan; sumCollateral += colVal; sumInterest += total;
      const ratio = (loan + total) > 0 ? (colVal / (loan + total) * 100) : 0;

      listEl.innerHTML += `
        <div class="stock-card">
          <div class="stock-main-row">
            <div class="stock-symbol-group"><span class="symbol-text">${p.symbol}</span><span class="tag-channel">質押</span></div>
            <div style="text-align:right;"><div class="num-font" style="font-size:1.18rem; font-weight:800; color:${ratio<130?'var(--up-red)':(ratio<166?'var(--gold)':'var(--down-green)')};">${ratio.toFixed(2)}%</div><div class="num-font" style="font-size:0.76rem; color:var(--up-red);">借款 NT$ ${loan.toLocaleString()}</div></div>
          </div>
        </div>
      `;
    });
    const allDebt = sumLoan + sumInterest;
    const overallRatio = allDebt > 0 ? (sumCollateral / allDebt * 100) : 0;
    const q = document.getElementById('quickRatioText'); if(q) q.innerText = overallRatio.toFixed(2) + '%';
    const pv = document.getElementById('pledgeViewRatio'); if(pv) pv.innerText = overallRatio.toFixed(2) + '%';
    const pi = document.getElementById('pledgeViewInterest'); if(pi) pi.innerText = 'NT$ ' + sumInterest.toLocaleString();
    return { sumLoan, sumInterest };
  }

  function renderDividendsView() {
    const listEl = document.getElementById('dividendCardList');
    if (!listEl) return;
    listEl.innerHTML = '';
    let totalRec = 0;
    for (const sym of Object.keys(stockDividends)) { totalRec += stockDividends[sym]; }
    const tr = document.getElementById('divCardTotalReceived'); if(tr) tr.innerText = 'NT$ ' + Math.round(totalRec).toLocaleString();
    const hr = document.getElementById('heroTotalDividends'); if(hr) hr.innerText = 'NT$ ' + Math.round(totalRec).toLocaleString();
  }

  function render() {
    const holdings = calculateHoldings();
    let sumTWNet = 0, sumUS = 0, costTW = 0, costUS = 0;
    for (const item of Object.values(holdings)) {
      if (item.shares <= 0.00001) continue;
      const quote = currentQuotes[item.symbol] || (item.totalCost / item.shares);
      const { netVal } = calculateCathayLiquidation(item.channel, item.symbol, item.shares, quote);
      if (item.channel === 'TW') { sumTWNet += netVal; costTW += item.totalCost; }
      else { sumUS += netVal; costUS += item.totalCost; }
    }
    const totalAllTWD = sumTWNet + (sumUS * usdtwdRate);
    const totalCostTWD = costTW + (costUS * usdtwdRate);
    const profitTWD = totalAllTWD - totalCostTWD;
    const { sumLoan, sumInterest } = renderPledges();
    const netWorth = totalAllTWD - sumLoan - sumInterest;

    const nw = document.getElementById('heroNetWorth'); if(nw) nw.innerText = 'NT$ ' + Math.round(netWorth).toLocaleString();
    const np = document.getElementById('heroNetProfit'); if(np) np.innerHTML = `<span style="color:${profitTWD>=0?'var(--up-red)':'var(--down-green)'};">未實現: NT$ ${Math.round(profitTWD).toLocaleString()}</span>`;
    const sa = document.getElementById('statTotalAll'); if(sa) sa.innerText = 'NT$ ' + Math.round(totalAllTWD).toLocaleString();
    const sl = document.getElementById('statTotalLoan'); if(sl) sl.innerText = 'NT$ ' + Math.round(sumLoan).toLocaleString();
    const st = document.getElementById('statTotalTW'); if(st) st.innerText = 'NT$ ' + Math.round(sumTWNet).toLocaleString();
    const su = document.getElementById('statTotalUS'); if(su) su.innerText = '$ ' + sumUS.toFixed(2);

    renderPortfolioList();
    renderDividendsView();
  }

  // 5. 事件監聽
  const tradeFormEl = document.getElementById('tradeForm');
  if (tradeFormEl) {
    tradeFormEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const sym = document.getElementById('symbol').value.trim().toUpperCase();
      const pr = parseFloat(document.getElementById('price').value);
      trades.push({
        channel: document.getElementById('channel').value,
        date: document.getElementById('tradeDate').value,
        symbol: sym,
        type: document.getElementById('tradeType').value,
        shares: parseFloat(document.getElementById('shares').value),
        price: pr
      });
      if (!currentQuotes[sym]) currentQuotes[sym] = pr;
      localStorage.setItem('capital_pro_trades_v5', JSON.stringify(trades));
      render();
      alert('記帳成功！');
      switchTab('viewPortfolio');
      fetchAllQuotes(false);
    });
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPortfolioList();
  }

  function exportBackupJSON() {
    const blob = new Blob([JSON.stringify({ trades, pledges, quotes: currentQuotes }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'capital_backup.json'; a.click();
  }

  function triggerRestoreJSON() { document.getElementById('restoreFileInput').click(); }
  function handleRestoreFile(input) {
    const file = input.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = function(e) {
      try {
        const d = JSON.parse(e.target.result);
        trades = d.trades || []; pledges = d.pledges || []; currentQuotes = d.quotes || {};
        localStorage.setItem('capital_pro_trades_v5', JSON.stringify(trades));
        localStorage.setItem('capital_pro_pledges_v5', JSON.stringify(pledges));
        render(); alert('還原完成！');
      } catch(err) { alert('檔案格式錯誤'); }
    };
    r.readAsText(file);
  }

  // 初始化執行
  renderOverviewWidgets();
  render();
  fetchAllQuotes(false);

  </script>
</body>
</html>
